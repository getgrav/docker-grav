name: Build and Push Docker Images

on:
  # Triggered by Grav releases
  repository_dispatch:
    types: [grav-release]

  # Manual trigger
  workflow_dispatch:
    inputs:
      channel:
        description: 'Grav channel (stable or beta)'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta

  # Also build on push to master (for Dockerfile changes)
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'config/**'

  # Weekly rebuild so images pick up base-image (Debian/PHP) security updates and
  # the latest stable Grav release even when no grav-release dispatch has fired.
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC

env:
  REGISTRY: docker.io
  IMAGE_NAME: getgrav/grav

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - php: "8.3"
            default: true
          - php: "8.5"
            default: false
          - php: "8.4"
            default: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          TAGS="${{ env.IMAGE_NAME }}:php${{ matrix.php }}"
          if [ "${{ matrix.default }}" = "true" ]; then
            TAGS="${TAGS},${{ env.IMAGE_NAME }}:latest,${{ env.IMAGE_NAME }}:1.7"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Note: Docker Hub description is managed manually via web UI
  # The API requires password auth (not access tokens) and is blocked by Cloudflare
